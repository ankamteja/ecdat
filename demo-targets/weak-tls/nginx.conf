# Deliberately insecure. See README.md.
#
# Every setting below is a finding ECDAT is expected to report:
#   TLSv1 and TLSv1.1  deprecated by RFC 8996
#   DES-CBC3-SHA       64 bit block cipher, SWEET32 (CVE-2016-2183)
#   RC4-MD5            prohibited in TLS by RFC 7465
#   @SECLEVEL=0        required by OpenSSL 3 to permit the above at all

worker_processes 1;
events { worker_connections 64; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server {
        listen 8443 ssl;
        server_name legacy.ecdat.local;

        ssl_certificate     /etc/nginx/certs/weak.crt;
        ssl_certificate_key /etc/nginx/certs/weak.key;

        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers "DEFAULT:@SECLEVEL=0:ALL:!aNULL:DES-CBC3-SHA:RC4-MD5:AES128-SHA";
        ssl_prefer_server_ciphers on;

        location / {
            add_header Content-Type text/plain;
            return 200 "ECDAT weak TLS demo target. Deliberately insecure.\n";
        }
    }
}
