<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="'Geist','Noto Sans',Arial,sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="trust_a" markerWidth="7" markerHeight="7" refX="6.2" refY="3" orient="auto"><path d="M0,0.6 L6,3 L0,5.4 Z" fill="#4f5d75"/></marker><marker id="trust_aa" markerWidth="7" markerHeight="7" refX="6.2" refY="3" orient="auto"><path d="M0,0.6 L6,3 L0,5.4 Z" fill="#eb6c36"/></marker><marker id="trust_al" markerWidth="7" markerHeight="7" refX="6.2" refY="3" orient="auto"><path d="M0,0.6 L6,3 L0,5.4 Z" fill="#2e5aa8"/></marker></defs><text x="0" y="12" font-family="'Geist Mono','Noto Sans Mono',monospace" font-size="8" fill="#7a8399" text-anchor="start" font-weight="400" letter-spacing="1.6">FIGURE 09</text><rect x="20" y="28" width="350" height="150" rx="6" fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="4 4" opacity="0.75"/><text x="29" y="42" font-family="'Geist Mono','Noto Sans Mono',monospace" font-size="8" letter-spacing="1.4" fill="#7a8399">UNTRUSTED ZONE</text><rect x="45" y="62" width="145" height="50" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/><text x="117.5" y="85.0" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">Scan targets</text><text x="117.5" y="99.0" font-family="'Geist Mono','Noto Sans Mono',monospace" font-size="9.5" fill="#4f5d75" text-anchor="middle">attacker influenced</text><rect x="210" y="62" width="140" height="50" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/><text x="280.0" y="85.0" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">Repo content</text><text x="280.0" y="99.0" font-family="'Geist Mono','Noto Sans Mono',monospace" font-size="9.5" fill="#4f5d75" text-anchor="middle">data, not authority</text><text x="45" y="140" font-family="'Geist','Noto Sans',Arial,sans-serif" font-size="9" fill="#7a8399" text-anchor="start" font-weight="400" letter-spacing="0">Repository files, certificates and TLS</text><text x="45" y="153" font-family="'Geist','Noto Sans',Arial,sans-serif" font-size="9" fill="#7a8399" text-anchor="start" font-weight="400" letter-spacing="0">banners are inputs. Never instructions.</text><rect x="390" y="28" width="350" height="150" rx="6" fill="none" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4 4" opacity="0.75"/><text x="399" y="42" font-family="'Geist Mono','Noto Sans Mono',monospace" font-size="8" letter-spacing="1.4" fill="#eb6c36">TRUSTED ZONE</text><rect x="415" y="62" width="145" height="50" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/><text x="487.5" y="85.0" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">API + Engine</text><text x="487.5" y="99.0" font-family="'Geist Mono','Noto Sans Mono',monospace" font-size="9.5" fill="#4f5d75" text-anchor="middle">authenticated</text><rect x="580" y="62" width="140" height="50" rx="4" fill="rgba(235,108,54,0.07)" stroke="#eb6c36" stroke-width="1.2"/><text x="650.0" y="85.0" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">Audit log</text><text x="650.0" y="99.0" font-family="'Geist Mono','Noto Sans Mono',monospace" font-size="9.5" fill="#4f5d75" text-anchor="middle">append only</text><text x="415" y="140" font-family="'Geist','Noto Sans',Arial,sans-serif" font-size="9" fill="#7a8399" text-anchor="start" font-weight="400" letter-spacing="0">JWT gated writes. Every scan request</text><text x="415" y="153" font-family="'Geist','Noto Sans',Arial,sans-serif" font-size="9" fill="#7a8399" text-anchor="start" font-weight="400" letter-spacing="0">recorded before any socket opens.</text><line x1="380" y1="20" x2="380" y2="196" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="6 4"/><text x="380" y="208" font-family="'Geist Mono','Noto Sans Mono',monospace" font-size="8.5" fill="#eb6c36" text-anchor="middle" font-weight="400" letter-spacing="1.6">TRUST BOUNDARY</text><line x1="352" y1="87" x2="413" y2="87" stroke="#eb6c36" stroke-width="1" marker-end="url(#trust_aa)"/><rect x="355.2" y="74.0" width="54.6" height="12" fill="#ffffff" opacity="0.95"/><text x="382.5" y="83.0" font-family="'Geist Mono','Noto Sans Mono',monospace" font-size="8.5" fill="#eb6c36" letter-spacing="0.4" text-anchor="middle">validated</text><rect x="20" y="232" width="720" height="120" rx="5" fill="#f5f5f5" stroke="#bfc0c0"/><text x="36" y="252" font-family="'Geist Mono','Noto Sans Mono',monospace" font-size="8.5" fill="#eb6c36" text-anchor="start" font-weight="400" letter-spacing="1.6">KEY MATERIAL HANDLING</text><text x="40" y="276" font-family="'Geist','Noto Sans',Arial,sans-serif" font-size="10" fill="#2d3142" text-anchor="start" font-weight="600" letter-spacing="0">Detected literal</text><text x="40" y="292" font-family="'Geist Mono','Noto Sans Mono',monospace" font-size="8.8" fill="#4f5d75" text-anchor="start" font-weight="400" letter-spacing="0">never persisted</text><line x1="205" y1="266" x2="205" y2="300" stroke="#bfc0c0" stroke-width="1"/><text x="220" y="276" font-family="'Geist','Noto Sans',Arial,sans-serif" font-size="10" fill="#2d3142" text-anchor="start" font-weight="600" letter-spacing="0">Stored instead</text><text x="220" y="292" font-family="'Geist Mono','Noto Sans Mono',monospace" font-size="8.8" fill="#4f5d75" text-anchor="start" font-weight="400" letter-spacing="0">path, line, entropy</text><line x1="385" y1="266" x2="385" y2="300" stroke="#bfc0c0" stroke-width="1"/><text x="400" y="276" font-family="'Geist','Noto Sans',Arial,sans-serif" font-size="10" fill="#2d3142" text-anchor="start" font-weight="600" letter-spacing="0">Plus</text><text x="400" y="292" font-family="'Geist Mono','Noto Sans Mono',monospace" font-size="8.8" fill="#4f5d75" text-anchor="start" font-weight="400" letter-spacing="0">4 chars + SHA-256 stub</text><line x1="565" y1="266" x2="565" y2="300" stroke="#bfc0c0" stroke-width="1"/><text x="580" y="276" font-family="'Geist','Noto Sans',Arial,sans-serif" font-size="10" fill="#2d3142" text-anchor="start" font-weight="600" letter-spacing="0">Verified by</text><text x="580" y="292" font-family="'Geist Mono','Noto Sans Mono',monospace" font-size="8.8" fill="#4f5d75" text-anchor="start" font-weight="400" letter-spacing="0">grep of DB and reports</text><text x="36" y="325" font-family="'Geist','Noto Sans',Arial,sans-serif" font-size="9" fill="#7a8399" text-anchor="start" font-weight="400" letter-spacing="0">The test asserts zero hits. If a sample secret appears anywhere in the database or in a generated report,</text><text x="36" y="339" font-family="'Geist','Noto Sans',Arial,sans-serif" font-size="9" fill="#7a8399" text-anchor="start" font-weight="400" letter-spacing="0">the claim on slide 4 is false and the build is broken, not the test.</text></svg>