monospace" font-size="8.5" letter-spacing="1.5" fill="#7a8399" text-anchor="middle">READ ONLY MOUNT</text><text x="145.0" y="216.0" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">knowledge/</text><text x="145.0" y="230.0" font-family="'Geist Mono','Noto Sans Mono',monospace" font-size="9.5" fill="#4f5d75" text-anchor="middle">YAML, bundled</text><rect x="520" y="180" width="190" height="64" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/><text x="615.0" y="195" font-family="'Geist Mono','Noto Sans Mono',monospace" font-size="8.5" letter-spacing="1.5" fill="#7a8399" text-anchor="middle">READ ONLY MOUNT</text><text x="615.0" y="216.0" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">samples/</text><text x="615.0" y="230.0" font-family="'Geist Mono','Noto Sans Mono',monospace" font-size="9.5" fill="#4f5d75" text-anchor="middle">vulnerable repo, certs</text><line x1="242" y1="104" x2="283" y2="104" stroke="#2e5aa8" stroke-width="1" marker-end="url(#deploy_al)"/><rect x="248.7" y="91.0" width="27.6" height="12" fill="#ffffff" opacity="0.95"/><text x="262.5" y="100.0" font-family="'Geist Mono','Noto Sans Mono',monospace" font-size="8.5" fill="#2e5aa8" letter-spacing="0.4" text-anchor="middle">/api</text><line x1="380" y1="146" x2="380" y2="178" stroke="#4f5d75" stroke-width="1" marker-end="url(#deploy_a)"/><rect x="358.1" y="149.0" width="43.800000000000004" height="12" fill="#ffffff" opacity="0.95"/><text x="380.0" y="158.0" font-family="'Geist Mono','Noto Sans Mono',monospace" font-size="8.5" fill="#4f5d75" letter-spacing="0.4" text-anchor="middle">persist</text><line x1="240" y1="212" x2="283" y2="212" stroke="#4f5d75" stroke-width="1" marker-end="url(#deploy_a)"/><rect x="245.0" y="199.0" width="33.0" height="12" fill="#ffffff" opacity="0.95"/><text x="261.5" y="208.0" font-family="'Geist Mono','Noto Sans Mono',monospace" font-size="8.5" fill="#4f5d75" letter-spacing="0.4" text-anchor="middle">rules</text><line x1="518" y1="212" x2="477" y2="212" stroke="#4f5d75" stroke-width="1" marker-end="url(#deploy_a)"/><rect x="483.7" y="199.0" width="27.6" height="12" fill="#ffffff" opacity="0.95"/><text x="497.5" y="208.0" font-family="'Geist Mono','Noto Sans Mono',monospace" font-size="8.5" fill="#4f5d75" letter-spacing="0.4" text-anchor="middle">scan</text><line x1="478" y1="104" x2="518" y2="104" stroke="#eb6c36" stroke-width="1" marker-end="url(#deploy_aa)"/><rect x="451.8" y="91.0" width="92.4" height="12" fill="#ffffff" opacity="0.95"/><text x="498.0" y="100.0" font-family="'Geist Mono','Noto Sans Mono',monospace" font-size="8.5" fill="#eb6c36" letter-spacing="0.4" text-anchor="middle">authorised probe</text><text x="380" y="300" font-family="'Geist','Noto Sans',Arial,sans-serif" font-size="9.5" fill="#7a8399" text-anchor="middle" font-weight="400" letter-spacing="0">No outbound network call except to the scan target itself. Rules and schema are bundled,</text><text x="380" y="314" font-family="'Geist','Noto Sans',Arial,sans-serif" font-size="9.5" fill="#7a8399" text-anchor="middle" font-weight="400" letter-spacing="0">so the whole stack runs with the cable unplugged. That is the data sovereignty claim, discharged.</text></svg>