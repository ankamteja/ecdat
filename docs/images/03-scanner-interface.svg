-size="9.5" fill="#4f5d75" text-anchor="middle">AST, rules, entropy</text><rect x="280" y="165" width="200" height="74" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/><text x="380.0" y="180" font-family="'Geist Mono','Noto Sans Mono',monospace" font-size="8.5" letter-spacing="1.5" fill="#7a8399" text-anchor="middle">KIND = TLS</text><text x="380.0" y="206.0" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">TlsScanner</text><text x="380.0" y="220.0" font-family="'Geist Mono','Noto Sans Mono',monospace" font-size="9.5" fill="#4f5d75" text-anchor="middle">handshake + cipher probe</text><rect x="530" y="165" width="200" height="74" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/><text x="630.0" y="180" font-family="'Geist Mono','Noto Sans Mono',monospace" font-size="8.5" letter-spacing="1.5" fill="#7a8399" text-anchor="middle">KIND = CERTIFICATE</text><text x="630.0" y="206.0" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">CertScanner</text><text x="630.0" y="220.0" font-family="'Geist Mono','Noto Sans Mono',monospace" font-size="9.5" fill="#4f5d75" text-anchor="middle">PyCA x509</text><path d="M380,106 L380,140 L130,140 L130,163" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#iface_a)"/><path d="M380,106 L380,140 L380,140 L380,163" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#iface_a)"/><path d="M380,106 L380,140 L630,140 L630,163" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#iface_a)"/><text x="380" y="133" font-family="'Geist Mono','Noto Sans Mono',monospace" font-size="8.5" fill="#7a8399" text-anchor="middle" font-weight="400" letter-spacing="0">implemented by</text><rect x="250" y="272" width="260" height="58" rx="4" fill="rgba(235,108,54,0.07)" stroke="#eb6c36" stroke-width="1.2"/><text x="380.0" y="299.0" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">RawFinding</text><text x="380.0" y="313.0" font-family="'Geist Mono','Noto Sans 