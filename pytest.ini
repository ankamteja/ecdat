# Test runner configuration.
#
# pythonpath adds backend/ so `import app` resolves without an editable
# install, and the repo root so `from tests.conftest import run_scan` works
# from any test module.
#
# DeprecationWarning from our own code is promoted to an error, so an API we
# stop supporting cannot quietly keep working until it breaks in production.
[pytest]
testpaths = tests
pythonpath = backend .
filterwarnings =
    error::DeprecationWarning:app.*
addopts = -q
